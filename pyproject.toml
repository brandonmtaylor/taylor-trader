[project]
name = "taylortrader"
version = "0.1.0"
description = "A trading bot and long-term investing autopilot for Alpaca, built safety-first."
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
authors = [{ name = "Brandon Taylor" }]
keywords = ["trading", "alpaca", "trading-bot", "investing", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # alpaca-py is pre-1.0 and changes often: pin exactly, upgrade on purpose.
    "alpaca-py==0.44.0",
    "pandas>=2.2,<4",
    "numpy>=2.0,<3",
    # Only used through pandas, and has a new major version every few months: no cap, the weekly check covers it.
    "pyarrow>=17",
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    # Unofficial Yahoo Finance client, for feed = "yahoo". Breaks when Yahoo changes; pin and upgrade on purpose.
    "yfinance==1.7.0",
    "anthropic>=2.4,<3",
    "openai>=1.50,<4",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/brandonmtaylor/taylor-trader"
Issues = "https://github.com/brandonmtaylor/taylor-trader/issues"

[project.scripts]
taylortrader = "taylortrader.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taylortrader", "src/guardrails"]
# The built dashboard is git-ignored (it's generated) but ships in the wheel, so installing needs no Node.
artifacts = ["src/taylortrader/web/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/taylortrader/web/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
