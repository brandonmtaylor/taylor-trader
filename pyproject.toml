[project]
name = "taylortrader"
version = "0.1.0"
description = "An open-source autonomous trading bot for Alpaca, built safety-first."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Brandon Taylor" }]
dependencies = [
    # alpaca-py is pre-1.0 and changes often: pin exactly, upgrade on purpose.
    "alpaca-py==0.44.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Unofficial Yahoo Finance client, for feed = "yahoo". Breaks when Yahoo changes; pin and upgrade on purpose.
    "yfinance==1.7.0",
    "anthropic>=0.60",
    "openai>=1.50",
    "mcp>=1.0",
]

[project.scripts]
taylortrader = "taylortrader.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taylortrader", "src/guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
