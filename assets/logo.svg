<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TaylorTrader">
  <!-- A candlestick whose wick forms a T, held between brackets: a trade kept inside its limits. -->
  <rect width="64" height="64" rx="14" fill="#0e1621"/>
  <path d="M19 14 H13 V50 H19 M45 14 H51 V50 H45" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 14 H40 M32 14 V52" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="25" y="22" width="14" height="20" rx="3" fill="#2fbf71"/>
</svg>
