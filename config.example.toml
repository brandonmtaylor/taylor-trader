# TaylorTrader configuration. The dashboard (`uv run taylortrader`) writes config.toml for you;
# this file documents every setting if you'd rather copy it and edit by hand.
# No secrets go in this file. See .env.example for keys.

# "paper" or "live". Switch from the dashboard: live needs live keys and a typed confirmation,
# which sets TAYLORTRADER_ALLOW_LIVE (the service refuses live without it).
mode = "paper"

# true: decide and alert, but place no orders. New setups start here.
dry_run = true

# Where the data cache, journal and logs live (git-ignored).
data_dir = "var"

# Where the service gets price bars. All three are free.
#   "yahoo" Yahoo Finance: every exchange and current, so it matches backtests (which use SIP).
#           Unofficial, so if it fails or falls behind the service switches to "iex" on its own
#           and back again when Yahoo recovers. Hourly strategies always use "iex".
#   "iex"   Alpaca, real time, but one exchange (~2-3% of volume): prices close, volume thin.
#   "sip"   Alpaca, every exchange, but the newest 15 minutes are held back. Backtests only.
feed = "yahoo"

# ---------------------------------------------------------------------------
# Strategies: pick any from `taylortrader strategies`. Add as many blocks as you want.
# ---------------------------------------------------------------------------
[[strategies]]
name = "macd_rsi"          # the original bot's main strategy
symbols = ["VRT"]
timeframe = "5Min"         # 1Min, 5Min, 15Min, 1Hour, 1Day
allocation_pct = 20        # % of equity per position (guardrails cap this too)
stop_loss_pct = 12         # stop held at Alpaca on every entry
take_profit_pct = 0        # 0 = no take-profit leg
enabled = true

# Optional per-strategy parameter overrides (defaults shown by `taylortrader strategies`)
[strategies.params]
rsi_buy = 35.5
rsi_sell = 68

# The AI strategy (experimental): a language model decides, inside the same guardrails.
